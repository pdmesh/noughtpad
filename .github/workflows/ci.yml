name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # tauri::generate_context! needs the frontend dist folder to exist.
      - run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: cargo fmt --all --check
      # The built-in LLM runtime (mistral.rs) is checked in its own job below.
      - run: cargo clippy --workspace --all-targets --no-default-features --features noughtpad-app/embedding-static -- -D warnings
      - run: cargo test --workspace --no-default-features --features noughtpad-app/embedding-static

  # The local language-model runtime: a large dependency, so it gets its own cached job.
  llm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: llm
      - run: cargo clippy -p noughtpad-llm --all-targets --features local,remote,keychain -- -D warnings
      - run: cargo test -p noughtpad-llm --features remote,keychain

  # Downloads the real embedding model and checks that the similarity
  # thresholds separate related from unrelated notes.
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/noughtpad-model
          key: model-bge-small-en-v1.5-q
      - run: cargo test -p noughtpad-core --features embedding-static -- --ignored --nocapture model_
        env:
          NOUGHTPAD_MODEL_DIR: /home/runner/.cache/noughtpad-model

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Capture-speed budget: open → typing in the editor (design risk #1).
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf
