name: Release

# Builds installers. Run it by hand (Actions → Release → Run workflow) to get
# test builds as downloadable artifacts, or push a tag like v0.2.0 to also
# create a draft GitHub release.
#
# Signing is optional: without the secrets below, macOS builds are ad-hoc
# signed (open with right-click → Open, or `xattr -cr Noughtpad.app`) and
# Windows builds are unsigned (SmartScreen warns).
#   macOS:   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID  (needs the $99/yr Apple Developer Program)
#   Updater: TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD (free; `pnpm tauri signer generate`)
#
# Auto-update: with the updater secrets set, each build also makes a signed
# update bundle (macOS .app.tar.gz, Windows NSIS .exe, Linux .AppImage, each
# with a .sig) and a tag push adds them and `latest.json` to the draft release.
# The app reads releases/latest/download/latest.json, which GitHub serves from
# the newest *published* release: updates reach people when you press
# Publish on the draft, not before.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --features local-llm-metal
            name: macos-arm64
          - platform: windows-latest
            args: ""
            name: windows-x64
          - platform: ubuntu-24.04
            args: ""
            name: linux-x64
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}
          workspaces: ". -> target"
      - run: pnpm install --frozen-lockfile
      # Export only the signing secrets that exist: empty values would make the
      # bundler attempt (and fail) to sign.
      - name: Signing environment
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
              echo "using $v"
            fi
          done
          # Update bundles need the updater key; without it, build installers only.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater_args=--config src-tauri/tauri.updater.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: building without update bundles"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }} ${{ steps.signing.outputs.updater_args }}
          # Windows: point latest.json at the per-user NSIS installer (no admin prompt).
          updaterJsonPreferNsis: true
          # A tag push creates a draft release; a manual run only uploads artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Noughtpad {0}', github.ref_name) || '' }}
          releaseDraft: true
      - uses: actions/upload-artifact@v4
        with:
          name: noughtpad-${{ matrix.name }}
          path: |
            target/*/release/bundle/dmg/*.dmg
            target/*/release/bundle/macos/*.app
            target/*/release/bundle/macos/*.app.tar.gz*
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: warn
