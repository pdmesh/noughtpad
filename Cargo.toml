[workspace]
resolver = "2"
members = ["crates/noughtpad-core", "crates/noughtpad-llm", "src-tauri"]
# Replaced by the private sync crate in builds with sync (a Cargo patch can't
# replace a workspace member).
exclude = ["crates/noughtpad-sync-stub"]

[workspace.package]
version = "0.1.9"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/pdmesh/noughtpad"

[workspace.dependencies]
noughtpad-core = { path = "crates/noughtpad-core" }
noughtpad-llm = { path = "crates/noughtpad-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
