[workspace]
resolver = "2"
members = ["crates/nought-core", "crates/nought-llm", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
repository = "https://github.com/pdmesh/nought"

[workspace.dependencies]
nought-core = { path = "crates/nought-core" }
nought-llm = { path = "crates/nought-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
