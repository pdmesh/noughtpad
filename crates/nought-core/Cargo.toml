[package]
name = "nought-core"
description = "Vault, index and search engine for Nought"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
yaml_serde = "0.10"
rusqlite = { version = "0.41", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = "1"
blake3 = "1"
walkdir = "2"
notify-debouncer-full = "0.5"
tempfile = "3"
fastembed = { version = "7.5", default-features = false, optional = true }
ureq = { version = "3", optional = true }
# Same versions fastembed uses, for the inference (NLI) judge.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "api-24"], optional = true }
tokenizers = { version = "0.23", default-features = false, features = ["onig"], optional = true }
ndarray = { version = "0.17", optional = true }

[features]
default = []
# Model download over HTTPS (Hugging Face).
download = ["dep:ureq"]
# Local embeddings via fastembed/ONNX Runtime. `embedding-static` downloads and
# statically links ONNX Runtime at build time (release builds, CI);
# `embedding-dynamic` loads a system onnxruntime at run time (offline builds).
embedding = ["dep:fastembed", "dep:ort", "dep:tokenizers", "dep:ndarray", "download"]
embedding-static = ["embedding", "fastembed/ort-download-binaries-rustls-tls"]
embedding-dynamic = ["embedding", "fastembed/ort-load-dynamic"]

[dev-dependencies]
pretty_assertions = "1"

[[example]]
name = "semantic"
required-features = ["embedding"]

[[example]]
name = "ideas"
required-features = ["embedding"]

[[example]]
name = "judges"
required-features = ["embedding"]
