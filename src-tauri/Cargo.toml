[package]
name = "noughtpad-app"
description = "Noughtpad desktop app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "noughtpad_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["embedding-static", "local-llm"]
# Local embeddings with ONNX Runtime linked statically (downloaded at build time).
embedding-static = ["noughtpad-core/embedding-static"]
# Same, but loading a system onnxruntime at run time (for offline builds).
embedding-dynamic = ["noughtpad-core/embedding-dynamic"]
# Built-in language models (mistral.rs). Without it, only bring-your-own providers work.
local-llm = ["noughtpad-llm/local"]
local-llm-metal = ["noughtpad-llm/local-metal"]
local-llm-cuda = ["noughtpad-llm/local-cuda"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
noughtpad-core.workspace = true
noughtpad-llm = { workspace = true, features = ["remote", "keychain"] }
# The open stand-in; builds with sync patch in pdmesh/noughtpad-sync instead
# (scripts/sync-build.mjs, DESIGN §12.3).
noughtpad-sync = { path = "../crates/noughtpad-sync-stub" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono = "0.4"
ulid = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
