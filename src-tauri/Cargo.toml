[package]
name = "nought-app"
description = "Nought desktop app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "nought_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["embedding-static"]
# Local embeddings with ONNX Runtime linked statically (downloaded at build time).
embedding-static = ["nought-core/embedding-static"]
# Same, but loading a system onnxruntime at run time (for offline builds).
embedding-dynamic = ["nought-core/embedding-dynamic"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nought-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono = "0.4"
ulid = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
